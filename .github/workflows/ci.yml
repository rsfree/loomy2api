name: CI

on:
  push:
    branches: [main]
    tags-ignore: ["v*"]      # 打标签走 release 工作流
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build · vet · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true

      - name: Verify gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "以下文件未格式化，请运行 gofmt -w ."
            echo "$out"
            exit 1
          fi

      - name: go build
        run: go build ./...

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1 -v

      - name: Cross-compile check
        run: |
          CGO_ENABLED=0 GOOS=linux   GOARCH=amd64 go build -o /dev/null ./cmd/server
          CGO_ENABLED=0 GOOS=linux   GOARCH=arm64 go build -o /dev/null ./cmd/server
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -o /dev/null ./cmd/server
          CGO_ENABLED=0 GOOS=darwin  GOARCH=arm64 go build -o /dev/null ./cmd/server

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: test
    # main / tag 上的镜像由 release 工作流统一构建并推送，这里只在 PR 上验证 Dockerfile
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --build-arg VERSION=ci -t loomy2api:ci .

      - name: Smoke test image
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 17890:17890 loomy2api:ci
          trap 'docker logs smoke || true; docker rm -f smoke || true' EXIT

          ok=0
          for i in $(seq 1 20); do
            code=$(curl -s -o /tmp/h.json -w '%{http_code}' http://127.0.0.1:17890/healthz || true)
            if [ "$code" = "200" ] || [ "$code" = "503" ]; then ok=1; break; fi
            sleep 1
          done
          echo "healthz status=$code body=$(cat /tmp/h.json 2>/dev/null)"
          [ "$ok" = "1" ] || { echo "::error::/healthz 20s 内未就绪"; exit 1; }
          # 无账号时按设计 503；判据是身份字段
          grep -q '"service":"loomy2api"' /tmp/h.json
